<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF Fun</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, serif;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: normal;
      font-size: 1.8rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .gallery figure {
      text-align: center;
    }
    .gallery img {
      max-width: 100%;
      border-radius: 4px;
    }
    .gallery figcaption {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>GIF Fun</h1>
  <div class="gallery">
    <figure>
      <img src="hello-world.gif" alt="Hello World">
      <figcaption>hello world</figcaption>
    </figure>
    <figure>
      <img src="spinnie.gif" alt="Spinnie">
      <figcaption>spinnie</figcaption>
    </figure>
    <figure>
      <img src="with-ottilie-000.gif" alt="With Ottilie">
      <figcaption>with O</figcaption>
    </figure>
    <figure>
      <img src="zags.gif" alt="Zags">
      <figcaption>zags</figcaption>
    </figure>
  </div>
</body>
</html>
